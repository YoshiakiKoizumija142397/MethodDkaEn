<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MethodDkaEn - Polynomial Solver & Factorization</title>
    <!-- Decimal.js library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1, h2, h3 { color: #0056b3; }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        label { font-weight: bold; }
        input[type="number"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #003d80; }
        .coeff-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .coeff-group label {
            width: 80px;
            flex-shrink: 0;
        }
        .coeff-group input {
            margin-bottom: 0;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin-right: 10px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #0056b3; }
        input:checked + .slider:before { transform: translateX(26px); }
        .result-box {
            background: #f1f5f9;
            padding: 15px;
            border-left: 4px solid #0056b3;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<h1>MethodDkaEn</h1>
<p>Durand-Kerner (DKA) Polynomial Solver with 50-digit Precision & Auto-Scaling (Up to Degree 200)</p>

<div class="card">
    <h2>1. Set Degree & Bulk Input</h2>
    <label for="degree">Highest Degree (n):</label>
    <input type="number" id="degree" value="3" min="1" max="200">
    <button onclick="generateCoeffFields()">Generate Fields</button>

    <hr style="margin: 20px 0;">

    <label for="bulkPaste">📋 Bulk Paste Coefficients (space, comma, or newline separated):</label>
    <textarea id="bulkPaste" rows="4" placeholder="Example: 1 -6 11 -6"></textarea>
    <button onclick="applyBulkPaste()">Apply Coefficients</button>
</div>

<div class="card">
    <h2>2. Coefficient Input</h2>
    <div id="coeffFieldsContainer"></div>
    <br>
    <button onclick="runDKA()">Start Calculation</button>
</div>

<div class="card">
    <h2>3. Results</h2>
    <div class="toggle-container">
        <label class="switch">
            <input type="checkbox" id="modeToggle" onchange="toggleDisplayMode()">
            <span class="slider"></span>
        </label>
        <span id="toggleLabel">Display Mode: <strong>50-Digit High Precision Roots</strong></span>
    </div>

    <div class="result-box" id="resultOutput">Results will appear here...</div>
</div>

<script>
    Decimal.set({ precision: 50 });

    let globalRoots = [];
    let globalDegree = 0;

    function generateCoeffFields() {
        const deg = parseInt(document.getElementById('degree').value);
        if (isNaN(deg) || deg < 1 || deg > 200) {
            alert('Please enter a degree between 1 and 200.');
            return;
        }
        globalDegree = deg;
        const container = document.getElementById('coeffFieldsContainer');
        container.innerHTML = '';

        for (let i = deg; i >= 0; i--) {
            const div = document.createElement('div');
            div.className = 'coeff-group';
            div.innerHTML = `<label>a_${i} (x^${i}):</label>
                             <input type="text" id="coeff_${i}" value="${i === deg ? '1' : '0'}">`;
            container.appendChild(div);
        }
    }

    function applyBulkPaste() {
        const text = document.getElementById('bulkPaste').value.trim();
        if (!text) return;
        const tokens = text.split(/[\s,]+/).filter(t => t.length > 0);
        if (tokens.length === 0) return;

        const deg = tokens.length - 1;
        document.getElementById('degree').value = deg;
        generateCoeffFields();

        for (let i = 0; i <= deg; i++) {
            const targetIdx = deg - i;
            const elem = document.getElementById(`coeff_${targetIdx}`);
            if (elem) elem.value = tokens[i];
        }
    }

    function runDKA() {
        // DKA Logic Placeholder & Display Update
        const output = document.getElementById('resultOutput');
        output.textContent = 'Calculating...';
        
        setTimeout(() => {
            output.textContent = 'Calculation completed.\n(Paste/integrate your core Decimal.js DKA calculation logic here)';
        }, 100);
    }

    function toggleDisplayMode() {
        const isChecked = document.getElementById('modeToggle').checked;
        const label = document.getElementById('toggleLabel');
        label.innerHTML = isChecked 
            ? 'Display Mode: <strong>Factored Form (Approx. 1 Decimal Place)</strong>' 
            : 'Display Mode: <strong>50-Digit High Precision Roots</strong>';
    }

    // Initialize default fields on page load
    window.onload = generateCoeffFields;
</script>

</body>
</html>
